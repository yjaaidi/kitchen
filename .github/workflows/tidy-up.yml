name: Tidy up trigger

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidyup_gate:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.tidyup.outputs.found }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for // TIDYUP in added lines
        id: tidyup
        env:
          BASE: charted-coding-1-design-doc
        run: |
          git fetch origin "$BASE"
          if git diff "origin/${BASE}...HEAD" | egrep -q '^\+ *// TIDYUP'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No newly added lines containing // TIDYUP, skipping."
          fi

  fire:
    needs: tidyup_gate
    if: needs.tidyup_gate.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fire tidy-up routine
        uses: ./.github/actions/fire-claude-routine
        env:
          CLAUDE_CODE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_CODE_ROUTINE_FIRE_TOKEN }}
        with:
          skill: tidy-up
          message: >-
            New // TIDYUP markers on this branch vs base charted-coding-1-design-doc.
            Triggering ref: ${{ github.ref }}
